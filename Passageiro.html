<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passageiro</title>

  <style>

    body{
      margin:0;
      padding:20px;
      font-family:Arial;
      background:#111827;
      color:white;
    }

    .card{
      background:#1f2937;
      padding:20px;
      border-radius:15px;
      max-width:500px;
      margin:auto;
    }

    input{
      width:100%;
      padding:15px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      font-size:16px;
    }

    button{
      width:100%;
      padding:15px;
      margin-top:20px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      font-size:18px;
      cursor:pointer;
      font-weight:bold;
    }

    h1{
      text-align:center;
    }

  </style>
</head>

<body>

  <div class="card">

    <h1>Painel do Passageiro</h1>

    <input type="text" id="origem" placeholder="Digite a origem">

    <input type="text" id="destino" placeholder="Digite o destino">

    <button onclick="pedirCorrida()">
      Pedir Corrida
    </button>

    <p id="status"></p>

  </div>

  <script>

    function pedirCorrida(){

      const origem = document.getElementById("origem").value;
      const destino = document.getElementById("destino").value;

      if(!origem || !destino){
        alert("Preencha origem e destino");
        return;
      }

      const corrida = {
        origem,
        destino,
        status:"Aguardando motorista"
      };

      localStorage.setItem("corrida", JSON.stringify(corrida));

      document.getElementById("status").innerHTML =
      "Corrida solicitada com sucesso!";

    }

  </script>

</body>
</html>
