<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motorista</title>

  <style>

    body{
      margin:0;
      padding:20px;
      font-family:Arial;
      background:#0f172a;
      color:white;
    }

    .card{
      background:#1e293b;
      padding:20px;
      border-radius:15px;
      max-width:500px;
      margin:auto;
    }

    h1{
      text-align:center;
    }

    .corrida{
      background:#334155;
      padding:15px;
      border-radius:10px;
      margin-top:20px;
    }

    button{
      width:100%;
      padding:15px;
      margin-top:15px;
      border:none;
      border-radius:10px;
      background:#16a34a;
      color:white;
      font-size:18px;
      cursor:pointer;
      font-weight:bold;
    }

  </style>
</head>

<body>

  <div class="card">

    <h1>Painel do Motorista</h1>

    <div class="corrida">

      <p><strong>Origem:</strong> <span id="origem"></span></p>

      <p><strong>Destino:</strong> <span id="destino"></span></p>

      <p><strong>Status:</strong> <span id="status"></span></p>

      <button onclick="aceitarCorrida()">
        Aceitar Corrida
      </button>

    </div>

  </div>

  <script>

    const corrida = JSON.parse(localStorage.getItem("corrida"));

    if(corrida){

      document.getElementById("origem").innerHTML = corrida.origem;
      document.getElementById("destino").innerHTML = corrida.destino;
      document.getElementById("status").innerHTML = corrida.status;

    }

    function aceitarCorrida(){

      corrida.status = "Motorista a caminho";

      localStorage.setItem("corrida", JSON.stringify(corrida));

      document.getElementById("status").innerHTML =
      corrida.status;

      alert("Corrida aceita!");

    }

  </script>

</body>
</html>
